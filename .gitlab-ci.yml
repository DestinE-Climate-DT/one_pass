stages:
  - prepare
  - lint
  - test

buildcloud:
  id_tokens:
    CI_JOB_JWT:
      aud: https://earth.bsc.es/gitlab
  tags:
    - csccloud
  stage: prepare
  script:
    - python3.11 -m venv venv
    - source venv/bin/activate
    - python3.11 -m pip install --upgrade pip
    - pip3.11 install -e .[tests]
    - pip3.11 install pylint

buildcloud312:
  id_tokens:
    CI_JOB_JWT:
      aud: https://earth.bsc.es/gitlab
  tags:
    - csccloud
  stage: prepare
  script:
    - python3.12 -m venv venv
    - source venv/bin/activate
    - python3.12 -m pip install --upgrade pip
    - pip3.12 install -e .[tests]
    - pip3.12 install pylint

