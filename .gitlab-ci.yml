stages:
  - prepare
  - lint
  - test

buildcloud:
  id_tokens:
    CI_JOB_JWT:
      aud: https://earth.bsc.es/gitlab
  tags:
    - csccloud
  stage: prepare
  script:
    - python3.11 -m venv venv
    - source venv/bin/activate
    - python3.11 -m pip install --upgrade pip
    - pip3.11 install -e .[all]
    - pip3.11 install pylint

buildcloud312:
  id_tokens:
    CI_JOB_JWT:
      aud: https://earth.bsc.es/gitlab
  tags:
    - csccloud
  stage: prepare
  script:
    - python3.12 -m venv venv
    - source venv/bin/activate
    - python3.12 -m pip install --upgrade pip
    - pip3.12 install -e .[all]
    - pip3.12 install pylint

buildlumi:
  id_tokens:
    CI_JOB_JWT:
      aud: https://earth.bsc.es/gitlab
  tags:
    - lumi
  variables:
    SCHEDULER_PARAMETERS: "-p debug -N 1 -n 4 --mem=8G -t 00:15:00 -A project_465000454"
  artifacts:
    paths:
      - venvlumi
    expire_in: 60 minutes
  stage: prepare
  script:
    - module load cray-python
    - python -m venv venvlumi
    - source venvlumi/bin/activate
    - python -m pip install --upgrade pip
    - pip install -e .[tests]

cache:
  paths:
    - 'venv'


