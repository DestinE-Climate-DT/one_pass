cache:
  paths:
    - 'venv'


lint:
  id_tokens:
    CI_JOB_JWT:
      aud: https://earth.bsc.es/gitlab
  allow_failure: true
  dependencies:
    - buildcloud
  needs:
    - buildcloud
  tags:
    - csccloud
  stage: lint
  script:
    - source venv/bin/activate
    - pylint --fail-under=9.8 one_pass

test:
  id_tokens:
    CI_JOB_JWT:
      aud: https://earth.bsc.es/gitlab
  variables:
    SCHEDULER_PARAMETERS: "-N 1 -t 03:00:00"
  dependencies:
    - buildcloud
  needs:
    - buildcloud
  tags:
    - csccloud
  stage: test
  script:
    - source venv/bin/activate
    - tools/get_test_data.sh
    - pytest --cov-report xml --cov-report term-missing --cov=one_pass tests/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  # These artifacts are saved with every build in GitLab and can be reviewed later. If
  # we have a folder with HTML files, as in this example, users can navigate with their
  # browser.
  artifacts:
    expire_in: 30 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test312:
  id_tokens:
    CI_JOB_JWT:
      aud: https://earth.bsc.es/gitlab
  variables:
    SCHEDULER_PARAMETERS: "-N 1 -t 03:00:00"
  dependencies:
    - buildcloud312
  needs:
    - buildcloud312
  tags:
    - csccloud
  stage: test
  script:
    - source venv/bin/activate
    - tools/get_test_data.sh
    - pytest --cov-report xml --cov-report term-missing --cov=one_pass tests/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  # These artifacts are saved with every build in GitLab and can be reviewed later. If
  # we have a folder with HTML files, as in this example, users can navigate with their
  # browser.
  artifacts:
    expire_in: 30 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

